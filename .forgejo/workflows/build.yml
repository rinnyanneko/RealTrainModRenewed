name: Build Minecraft Mod

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  build:
    runs-on: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug files
        run: |
          pwd
          ls -lah
          find . -maxdepth 3 \( -name "gradlew" -o -name "build.gradle*" -o -name "settings.gradle*" \)

      - name: Install Java 25
        run: |
          apt-get update
          apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor -o /usr/share/keyrings/adoptium.gpg
          echo "deb [signed-by=/usr/share/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb bookworm main" > /etc/apt/sources.list.d/adoptium.list
          apt-get update
          apt-get install -y temurin-25-jdk

      - name: Show Java version
        run: java -version

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: sh ./gradlew build --no-daemon

      - name: List jars
        run: ls -lah build/libs

      - name: Prepare jar artifact
        id: prepare_artifact
        env:
          COMMIT_SHA: ${{ forgejo.sha }}
        run: |
          mkdir -p artifacts
          SHORT_SHA=$(printf '%.10s' "$COMMIT_SHA")
          ARTIFACT_NAME="RealTrainModRenewed-${SHORT_SHA}.jar"
          JAR_FILE=$(find build/libs -maxdepth 1 -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No mod jar found in build/libs"
            exit 1
          fi

          echo "Selected jar: $JAR_FILE"
          cp "$JAR_FILE" "artifacts/$ARTIFACT_NAME"
          printf 'artifact_name=%s\n' "$ARTIFACT_NAME" >> "$FORGEJO_OUTPUT"
          ls -lah artifacts

      - name: Upload jar artifact
        timeout-minutes: 10
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: ${{ steps.prepare_artifact.outputs.artifact_name }}
          path: artifacts/${{ steps.prepare_artifact.outputs.artifact_name }}
          if-no-files-found: error
          compression-level: 0
